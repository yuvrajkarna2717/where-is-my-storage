name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only ever needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Filesystem behaviour differs per platform, so a failure on one OS must not
      # hide the result on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node so that `cache: pnpm` can find the store.
      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (agnostic / node / dom)
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Architectural boundaries
        run: pnpm run boundaries

      - name: Formatting
        run: pnpm run format:check

      - name: Tests
        run: pnpm run test

  desktop:
    name: desktop self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium needs one of two sandbox mechanisms on Linux, and on the Ubuntu 24.04 runner
      # neither works out of the box. The app calls `app.enableSandbox()` unconditionally, so
      # Electron refuses to start rather than run unsandboxed:
      #
      #   FATAL ... The SUID sandbox helper binary was found, but is not configured correctly.
      #   Rather than run without sandboxing I'm aborting now.
      #
      # Both fixes below *enable* sandboxing. Passing --no-sandbox would turn this job into a
      # test of a configuration we do not ship, which is worse than not running it at all.
      #
      # The sysctl is the real fix: Ubuntu 24.04 restricts unprivileged user namespaces through
      # AppArmor, and that namespace sandbox is the mechanism Electron prefers and the one a
      # normal Linux desktop actually uses. Allowing it keeps CI on the same path as a real user.
      # The chown/chmod repairs the setuid fallback Electron drops to when namespaces are denied;
      # pnpm extracts `chrome-sandbox` owned by the runner, and it has to be root-owned 4755.
      # Kept as a belt to the sysctl's braces, because a runner kernel need not expose that knob.
      - name: Make Electron's sandbox usable (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          find node_modules/.pnpm -type f -name chrome-sandbox -print0 \
            | xargs -0 -r -I{} sh -c 'sudo chown root:root "{}" && sudo chmod 4755 "{}"'

      # Boots the real application — hardened window, preload, renderer, utility process, scan
      # host — drives a scan through the actual IPC path and exits non-zero on any failure.
      # This is the only check that can catch wiring faults: a preload that does not load, a
      # sandbox that blocks something needed, a utilityProcess that cannot be forked.
      # Linux runners have no display, so Electron needs a virtual one.
      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm run desktop:selftest

      - name: Self-test (Windows and macOS)
        if: runner.os != 'Linux'
        run: pnpm run desktop:selftest

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-screenshot-${{ matrix.os }}
          path: apps/desktop/out/selftest-screenshot.png
          if-no-files-found: warn
